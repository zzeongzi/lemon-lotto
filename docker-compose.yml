version: '3.8'

services:
  lemon-lotto:
    build: .
    container_name: lemon-lotto-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - BLINK_API_KEY=${BLINK_API_KEY}
      - BLINK_WALLET_ID=${BLINK_WALLET_ID}
      - BLINK_DONATE_WALLET_ID=${BLINK_DONATE_WALLET_ID}
      - MEMPOOL_URL=https://mempool.space
    volumes:
      - ./data:/app/data
      - ./lotto.db:/app/lotto.db
    networks:
      - lemon-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lemon-network:
    driver: bridge